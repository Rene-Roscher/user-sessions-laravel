name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
        exclude:
          # Laravel 13 requires PHP 8.3+
          - laravel: '13.*'
            php: '8.2'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, redis, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --colors=always

  # PLAN §12.3 / §13.1: the package claims to work with any session driver, so the suite
  # has to actually run against them. The store-backed activity resolver in particular
  # behaves differently per driver (TTL vs mtime vs not introspectable at all).
  drivers:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        session_driver: [array, file, redis]
        redis_client: [phpredis]
        include:
          - session_driver: redis
            redis_client: predis

    name: Session driver ${{ matrix.session_driver }}${{ matrix.session_driver == 'redis' && format(' · {0}', matrix.redis_client) || '' }}

    env:
      SESSION_DRIVER: ${{ matrix.session_driver }}
      REDIS_CLIENT: ${{ matrix.redis_client }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, redis, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --colors=always

  # SQLite cannot reproduce the failure modes that matter in production: it does not
  # enforce VARCHAR lengths, does not validate UTF-8, and implements upsert and NOT NULL
  # defaults differently. A green SQLite run says nothing about MySQL or Postgres, so the
  # suite runs against both — see tests/Feature/DatabaseEngineTest.php.
  databases:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: user_sessions_test
        ports:
          - 33061:3306
        options: >-
          --health-cmd "mysqladmin ping -psecret"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: user_sessions_test
        ports:
          - 54321:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            port: 33061
            username: root
          - db: pgsql
            port: 54321
            username: postgres

    name: Database ${{ matrix.db }}

    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_PORT: ${{ matrix.port }}
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: secret
      DB_DATABASE: user_sessions_test
      # Exercise the engine against the primary session driver too, not just "array".
      SESSION_DRIVER: redis

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, redis, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --colors=always

  coverage:
    runs-on: ubuntu-latest
    name: Coverage gate

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, redis, pdo, pdo_sqlite, sqlite3
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Enforce coverage
        run: vendor/bin/pest --coverage --min=90 --type-coverage --min=100 --colors=always
